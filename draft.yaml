models:
  Repository:
    url: text
    token: string
    relationships:
      hasMany: Source

  Source:
    path: text
    relationships:
      belongsTo: Repository
      hasMany: Document

  NotionWorkspace:
    name: string
    token: string
    relationships:
      hasMany: NotionDatabase

  NotionDatabase:
    id: string
    name: string
    relationships:
      belongsTo: NotionWorkspace


  Document:
    path: text
    content: text
    relationships:
      belongsTo: Source
